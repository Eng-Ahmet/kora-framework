version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: kora-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --requirepass kora_cache_secret
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kora_cache_secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
