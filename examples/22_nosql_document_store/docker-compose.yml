version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kora-mongodb-docstore
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: kora_mongo_secret
      MONGO_INITDB_DATABASE: kora_audit_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: kora-mongo-express
    restart: unless-stopped
    ports:
      - "8085:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: kora_mongo_secret
      ME_CONFIG_MONGODB_URL: mongodb://root:kora_mongo_secret@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo_data:
