name: Extension CI

on:
  pull_request:
    paths:
      - 'integrations/vscode/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-extension:
    name: Validate VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: |
          cd integrations/vscode
          npm install

      - name: Verify Extension Package Build
        run: |
          cd integrations/vscode
          npx @vscode/vsce package --no-git-tag-version --allow-missing-repository
