<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Internal Radial Accent -->
  <circle cx="128" cy="128" r="88" fill="#0284C7" opacity="0.12" filter="blur(20px)"/>

  <!-- Kora Signature 'K' Glyph - High-Visibility Solid Pure White with Cyan Wing -->
  <g filter="url(#glow)">
    <!-- Vertical Pillar -->
    <rect x="64" y="56" width="32" height="144" rx="8" fill="#FFFFFF"/>
    
    <!-- Upper Diagonal Wing -->
    <path d="M 96 128 L 158 64 C 162 60 168 58 174 58 L 192 58 C 198 58 202 65 198 70 L 138 132 Z" fill="url(#cyanGrad)"/>
    
    <!-- Lower Diagonal Leg -->
    <path d="M 124 118 L 198 192 C 203 197 199 204 192 204 L 170 204 C 164 204 158 201 154 197 L 96 138 Z" fill="#FFFFFF"/>
  </g>
</svg>